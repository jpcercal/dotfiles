# yaml-language-server: $schema=./schema/apps.schema.json
---
schema_version: 2
install:
  execution:
    max_jobs: 0
    locks:
      go: 2
  toolchains:
    rustup:
      channel: "stable"
    node:
      ensure: "lts"
    python:
      provider: "uv"
  bootstrap:
  - fzf-keybindings
  - python-links
  - nvim-plug
  require:
  - id: "brew-formula:jq"
    label: "jq"
  - id: "brew-formula:fd"
    label: "fd"
  - id: "brew-formula:fzf"
    label: "fzf"
  - id: "brew-formula:fnm"
    label: "fnm"
  - id: "brew-formula:uv"
    label: "uv"
  - id: "brew-formula:go"
    label: "go"
  - id: "brew-formula:dockutil"
    label: "dockutil"
  - id: "brew-formula:mas"
    label: "mas"
  - id: "brew-formula:neovim"
    label: "neovim"
  - id: "brew-formula:ruby"
    label: "ruby"
  - id: "brew-cask:caffeine"
    label: "caffeine"
  - id: "pip:pynvim"
    label: "pynvim"
  - id: "go:github.com/oklog/ulid/v2/cmd/ulid@latest"
    label: "github.com/oklog/ulid/v2/cmd/ulid"
  - id: "gem:neovim"
    label: "neovim"
    requires:
    - "brew-formula:ruby"
  - id: "npm:prettier"
    label: "prettier"
config:
  mkdir:
  - ~/.config/nvim/
  - ~/.config/tmux/
  symbolic_links:
  - from:
      relative_path: e2e/vimrc.ci
    to:
      absolute_path: ~/.config/nvim/init.vim
  - from:
      relative_path: .editorconfig
    to:
      absolute_path: ~/.editorconfig
  - from:
      relative_path: starship.toml
    to:
      absolute_path: ~/.config/starship.toml
  dockutil:
    _before:
      reset: false
      removeAll: false
    add: []
