# yaml-language-server: $schema=../schema/apps.schema.json
---
# Reduced manifest for the real-machine CI E2E job (`e2e-machine`). Mirrors
# the production structure (batches, implicit toolchain edges, bootstrap
# steps, symlinks) at a fraction of the wall-clock cost. Selected via
# DOTFILES_MANIFEST=e2e/apps.ci.yaml (with DOTFILES_DIR set to the repo root
# so symlink sources resolve).
#
# Coverage rule: at least one package of every installable backend type, so
# `doctor --smoke` invokes each ecosystem end to end. No MAS apps: App Store
# sign-in is unavailable on CI runners (the mas *type* is still covered via
# the `mas` CLI formula + `mas --help` smoke; app references are covered by
# `dotfiles verify` instead).
schema_version: 2
install:
  execution:
    max_jobs: 0
    locks:
      go: 2
  toolchains:
    rustup:
      channel: "stable"
    node:
      ensure: "lts"
    python:
      provider: "uv"
  bootstrap:
  - fzf-keybindings
  - python-links
  - nvim-plug
  require:
  - id: "brew-formula:jq"
    label: "jq"
  - id: "brew-formula:fd"
    label: "fd"
  - id: "brew-formula:fzf"
    label: "fzf"
  - id: "brew-formula:fnm"
    label: "fnm"
  - id: "brew-formula:uv"
    label: "uv"
  - id: "brew-formula:go"
    label: "go"
  - id: "brew-formula:dockutil"
    label: "dockutil"
    hooks:
      post-install: |
        if command -v dockutil >/dev/null 2>&1; then
          dockutil --add "/System/Applications/Launchpad.app" --after Finder >/dev/null 2>&1 || true
          dockutil --add "/System/Applications/Reminders.app" --after Finder >/dev/null 2>&1 || true
          dockutil --add "/System/Applications/Music.app" --after Finder >/dev/null 2>&1 || true
          killall Dock 2>/dev/null || true
        fi
  - id: "brew-formula:mas"
    label: "mas"
  - id: "brew-formula:neovim"
    label: "neovim"
    hooks:
      post-install: |
        mkdir -p "$HOME/.config/nvim"
        ln -sfn "$DOTFILES_DIR/e2e/vimrc.ci" "$HOME/.config/nvim/init.vim"
        ln -sfn "$DOTFILES_DIR/.editorconfig" "$HOME/.editorconfig"
        mkdir -p "$HOME/.config"
        ln -sfn "$DOTFILES_DIR/starship.toml" "$HOME/.config/starship.toml"
        if command -v nvim >/dev/null 2>&1; then nvim --headless '+PlugInstall --sync' +qa 2>/dev/null || true; fi
  - id: "brew-formula:ruby"
    label: "ruby"
  - id: "brew-cask:caffeine"
    label: "caffeine"
  - id: "pip:pynvim"
    label: "pynvim"
  - id: "go:github.com/oklog/ulid/v2/cmd/ulid@latest"
    label: "github.com/oklog/ulid/v2/cmd/ulid"
  - id: "gem:neovim"
    label: "neovim"
    requires:
    - "brew-formula:ruby"
  - id: "npm:prettier"
    label: "prettier"
