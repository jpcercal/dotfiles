# yaml-language-server: $schema=../schema/apps.schema.json
---
# Reduced manifest for the real-machine CI E2E job (`e2e-machine`). Mirrors
# the production structure (batches, implicit toolchain edges, bootstrap
# steps, symlinks) at a fraction of the wall-clock cost. Selected via
# DOTFILES_MANIFEST=e2e/apps.ci.yaml (with DOTFILES_DIR set to the repo root
# so symlink sources resolve).
#
# Coverage rule: at least one package of every installable backend type, so
# `doctor --smoke` invokes each ecosystem end to end. No MAS apps: App Store
# sign-in is unavailable on CI runners (the mas *type* is still covered via
# the `mas` CLI formula + `mas --help` smoke; app references are covered by
# `dotfiles verify` instead).
schema_version: 2
install:
  execution:
    max_jobs: 0
    locks:
      go: 2
  toolchains:
    rustup:
      channel: stable
    node:
      ensure: lts
    python:
      provider: uv
  bootstrap:
  - fzf-keybindings
  - python-links
  - nvim-plug
  require:
  - "brew-formula:jq"
  - "brew-formula:fd"
  - "brew-formula:fzf"
  - "brew-formula:fnm"
  - "brew-formula:uv"
  - "brew-formula:go"
  - "brew-formula:dockutil"
  - "brew-formula:mas"
  - "brew-formula:neovim"
  - "brew-formula:ruby"
  - "brew-cask:caffeine"
  - "pip:pynvim"
  - "go:github.com/oklog/ulid/v2/cmd/ulid@latest"
  - id: "gem:neovim"
    requires:
    - "brew-formula:ruby"
  - "npm:prettier"
config:
  mkdir:
  - ~/.config/nvim/
  - ~/.config/tmux/
  symbolic_links:
  - from:
      relative_path: e2e/vimrc.ci
    to:
      absolute_path: ~/.config/nvim/init.vim
  - from:
      relative_path: .editorconfig
    to:
      absolute_path: ~/.editorconfig
  - from:
      relative_path: starship.toml
    to:
      absolute_path: ~/.config/starship.toml
  dockutil:
    _before:
      reset: false
      removeAll: false
    add: []
