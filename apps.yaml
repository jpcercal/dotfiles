# yaml-language-server: $schema=./schema/apps.schema.json
---
schema_version: 1
install:
  # Parallel execution tuning for the dependency-graph engine: worker count
  # (0 = number of CPUs) + per lock-class concurrency. `brew` is capped at 1
  # (concurrent `brew` invocations are unsupported by Homebrew); every other
  # ecosystem installs in parallel with it.
  execution:
    max_jobs: 0
    locks:
      brew: 1
      mas: 4
      go: 4
  brew:
    taps:
      - "anomalyco/tap"
      - "aws/tap"
      - "hashicorp/tap"
    formulas:
      - "act"
      - "aircrack-ng"
      - "asciinema"
      - "atuin"
      - "automake"
      - "awscli"
      - "bash-completion"
      - "bash"
      - "bat"
      - "composer"
      - "coreutils"
      - "dockutil"
      - "doctl"
      - "eza"
      - "fd"
      - "fdupes"
      - "ffmpeg"
      - "findutils"
      - "fnm"
      - "fswatch"
      - "fzf"
      - "gdrive"
      - "gh"
      - "git-delta"
      - "git-lfs"
      - "git"
      - "gmp"
      - "gnu-sed"
      - "golangci-lint"
      - "httpie"
      - "exiftool"
      - "go"
      - "nmap"
      - "terraform"
      - "howdoi"
      - "hr"
      - "htmlq"
      - "htop"
      - "imagemagick"
      - "jq"
      - "kubectx"
      - "links"
      - "lynx"
      - "mas"
      - "moreutils"
      - "neovim"
      - "openssh"
      - "php"
      # Detailed entries declare dependency-graph edges: these tools run on
      # the Homebrew php, so they install only after `brew-formula:php`.
      - name: "php-code-sniffer"
        requires: ["brew-formula:php"]
      - name: "php-cs-fixer"
        requires: ["brew-formula:php"]
      - name: "phpstan"
        requires: ["brew-formula:php"]
      - "rclone"
      - "ripgrep"
      - "rsync"
      - "rtk"
      - "screen"
      - "sops"
      - "starship"
      - "taskwarrior-tui"
      - "terminal-notifier"
      - "tealdeer"
      - "tmux"
      - "tpm"
      - "tree"
      - "trivy"
      - "unison"
      - "universal-ctags"
      - "uv"
      - "vim"
      - "watch"
      - "watchexec"
      - "watchman"
      - "wget"
      - "yarn"
      - "you-get"
      - "yq"
      - "zsh-autosuggestions"
      - "zsh-completions"
      - "zsh-syntax-highlighting"
      - "zsh"
    casks: 
      - "alfred"
      - "appcleaner"
      - "brave-browser"
      - "caffeine"
      - "discord"
      - "displaylink"
      - "docker-desktop"
      - "firefox"
      - "font-3270-nerd-font"
      - "font-agave-nerd-font"
      - "font-anonymice-nerd-font"
      - "font-arimo-nerd-font"
      - "font-aurulent-sans-mono-nerd-font"
      - "font-bigblue-terminal-nerd-font"
      - "font-bitstream-vera-sans-mono-nerd-font"
      - "font-blex-mono-nerd-font"
      - "font-caskaydia-cove-nerd-font"
      - "font-code-new-roman-nerd-font"
      - "font-cousine-nerd-font"
      - "font-daddy-time-mono-nerd-font"
      - "font-dejavu-sans-mono-nerd-font"
      - "font-droid-sans-mono-nerd-font"
      - "font-fantasque-sans-mono-nerd-font"
      - "font-fira-code-nerd-font"
      - "font-fira-mono-nerd-font"
      - "font-go-mono-nerd-font"
      - "font-gohufont-nerd-font"
