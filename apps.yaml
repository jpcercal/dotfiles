# yaml-language-server: $schema=./schema/apps.schema.json
---
schema_version: 2
require:
- id: "brew-tap:anomalyco/tap"
- id: "brew-tap:aws/tap"
- id: "brew-tap:hashicorp/tap"
- id: "custom:rustup"
  hooks:
    post-install: |
      set -e
      if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile default >/dev/null
      fi
    pre-update: |
      rustup update
    pre-uninstall: |
      rustup self uninstall -y
- id: "brew-formula:act"
- id: "brew-formula:aircrack-ng"
- id: "brew-formula:asciinema"
- id: "brew-formula:atuin"
- id: "brew-formula:automake"
- id: "brew-formula:awscli"
- id: "brew-formula:bash-completion"
- id: "brew-formula:bash"
- id: "brew-formula:bat"
- id: "brew-formula:composer"
- id: "brew-formula:coreutils"
- id: "brew-formula:dockutil"
  hooks:
    post-install: |
      set -e
      dockutil --add "/System/Applications/Launchpad.app" --after Finder >/dev/null
      dockutil --add "/System/Applications/Reminders.app" --after Finder >/dev/null
      dockutil --add "/System/Applications/Music.app" --after Finder >/dev/null
      killall Dock >/dev/null
- id: "brew-formula:doctl"
- id: "brew-formula:eza"
- id: "brew-formula:fd"
- id: "brew-formula:fdupes"
- id: "brew-formula:ffmpeg"
- id: "brew-formula:findutils"
- id: "brew-formula:fnm"
  hooks:
    post-install: |
      set -e
      fnm install --lts >/dev/null
      fnm default lts-latest >/dev/null
      npx claude-mem install --ide opencode --provider openrouter >/dev/null
- id: "brew-formula:fswatch"
- id: "brew-formula:fzf"
  hooks:
    post-install: |
      set -e
      if [ ! -e "$HOME/.fzf.zsh" ]; then
        prefix="$(brew --prefix)"
        { echo y; echo y; echo y; } | "$prefix/opt/fzf/install" --no-update-rc >/dev/null
      fi
- id: "brew-formula:gdrive"
- id: "brew-formula:gh"
- id: "brew-formula:git-delta"
- id: "brew-formula:git-lfs"
  requires:
  - "brew-formula:git"
  hooks:
    post-install: |
      git lfs install >/dev/null
- id: "brew-formula:git"
  hooks:
    post-install: |
      set -e
      ln -sfn "$DOTFILES_DIR/.gitconfig" "$HOME/.gitconfig"
      ln -sfn "$DOTFILES_DIR/.gitignore_global" "$HOME/.gitignore_global"
      ln -sfn "$DOTFILES_DIR/.editorconfig" "$HOME/.editorconfig"
