      - id: "533696630" 
        name: "Webcam Settings" 
config:
  mkdir: 
    - ~/.config/nvim/
    - ~/.config/tmux/
  symbolic_links:  
    - from: 
        relative_path: ".curlrc"
      to: 
        absolute_path: "~/.curlrc"

    - from: 
        relative_path: ".editorconfig"
      to: 
        absolute_path: "~/.editorconfig"

    - from: 
        relative_path: ".gitconfig"
      to: 
        absolute_path: "~/.gitconfig"

    - from: 
        relative_path: ".gitignore_global"
      to: 
        absolute_path: "~/.gitignore_global"

    - from: 
        relative_path: ".netrc"
      to: 
        absolute_path: "~/.netrc"

    - from: 
        relative_path: ".vimrc"
      to: 
        absolute_path: "~/.config/nvim/init.vim"

    - from: 
        relative_path: ".vimrc"
      to: 
        absolute_path: "~/.vimrc"

    - from: 
        relative_path: ".zshrc"
      to: 
        absolute_path: "~/.zshrc"

    - from: 
        relative_path: ".zprofile"
      to: 
        absolute_path: "~/.zprofile"

    - from: 
        relative_path: ".zshenv"
      to: 
        absolute_path: "~/.zshenv"

    - from: 
        relative_path: "opencode/AGENTS.md"
      to: 
        absolute_path: "~/.config/opencode/AGENTS.md"

    - from: 
        relative_path: "opencode/opencode.json"
      to: 
        absolute_path: "~/.config/opencode/opencode.json"

    - from: 
        relative_path: "opencode/opencode.jsonc"
      to: 
        absolute_path: "~/.config/opencode/opencode.jsonc"

    - from: 
        relative_path: "rtk/config.toml"
      to: 
        absolute_path: "~/Library/Application Support/rtk/config.toml"

    - from: 
        relative_path: "rtk/filters.toml"
      to: 
        absolute_path: "~/Library/Application Support/rtk/filters.toml"

    - from: 
        relative_path: "starship.toml"
      to: 
        absolute_path: "~/.config/starship.toml"

    - from: 
        relative_path: "tmux.conf"
      to: 
        absolute_path: "~/.config/tmux/tmux.conf"
  dockutil:
    _before:
      reset: true
      removeAll: true
    add:
      - app: "/System/Applications/Launchpad.app"   
        after: "Finder"

      - app: "/Applications/Brave Browser.app"      
        after: "Finder"

      - app: "/Applications/Airmail.app"      
        after: "Finder"

      - app: "/System/Applications/Reminders.app"   
        after: "Finder"

      - app: "/System/Applications/Music.app"       
        after: "Finder"

      - app: "/Applications/iTerm.app"              
        after: "Finder"

      - app: "/Applications/Visual Studio Code.app" 
        after: "Finder"

      - app: "/Applications/iA Writer.app"          
        after: "Finder"

      - app: "/Applications/Trello.app"             
        after: "Finder"

      - app: "/Applications/Fantastical.app"        
        after: "Finder"

      - app: "/Applications/Slack.app"              
        after: "Finder"

      - app: "/Applications/WhatsApp.app"           
        after: "Finder"
