- id: "brew-formula:zsh-completions"
- id: "brew-formula:zsh-syntax-highlighting"
- id: "brew-formula:zsh"
  hooks:
    post-install: |
      set -e
      mkdir -p "$HOME/.config"
      ln -sfn "$DOTFILES_DIR/.zshrc" "$HOME/.zshrc"
      ln -sfn "$DOTFILES_DIR/.zprofile" "$HOME/.zprofile"
      ln -sfn "$DOTFILES_DIR/.zshenv" "$HOME/.zshenv"
      ln -sfn "$DOTFILES_DIR/.curlrc" "$HOME/.curlrc"
      ln -sfn "$DOTFILES_DIR/.netrc" "$HOME/.netrc"
      prefix="$(brew --prefix)"
      current="$(dscl . -read "/Users/$USER" UserShell | awk '{print $2}')"
      if [ "$current" != "$prefix/bin/zsh" ]; then sudo dscl . -create "/Users/$USER" UserShell "$prefix/bin/zsh"; fi
