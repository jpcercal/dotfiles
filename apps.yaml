- id: "brew-formula:neovim"
  hooks:
    post-install: |
      set -e
      mkdir -p "$HOME/.config/nvim"
      ln -sfn "$DOTFILES_DIR/.vimrc" "$HOME/.config/nvim/init.vim"
      plug="$HOME/.local/share/nvim/site/autoload/plug.vim"
      if [ ! -e "$plug" ]; then
        mkdir -p "$(dirname "$plug")"
        curl -fsSLo "$plug" https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim >/dev/null
      fi
      nvim --headless '+PlugInstall --sync' +qa >/dev/null
- id: "brew-formula:anomalyco/tap/opencode"
  hooks:
    post-install: |
      set -e
      mkdir -p "$HOME/.config/opencode/skills"
      ln -sfn "$DOTFILES_DIR/opencode/AGENTS.md" "$HOME/.config/opencode/AGENTS.md"
      ln -sfn "$DOTFILES_DIR/opencode/opencode.json" "$HOME/.config/opencode/opencode.json"
      ln -sfn "$DOTFILES_DIR/opencode/opencode.jsonc" "$HOME/.config/opencode/opencode.jsonc"
      ln -sfn "$DOTFILES_DIR/opencode/skills/builder" "$HOME/.config/opencode/skills/builder"
- id: "brew-formula:openssh"
- id: "brew-formula:php"
- id: "brew-formula:rclone"
- id: "brew-formula:ripgrep"
- id: "brew-formula:rsync"
- id: "brew-formula:rtk"
  hooks:
    post-install: |
      set -e
      mkdir -p "$HOME/Library/Application Support/rtk"
      ln -sfn "$DOTFILES_DIR/rtk/config.toml" "$HOME/Library/Application Support/rtk/config.toml"
      ln -sfn "$DOTFILES_DIR/rtk/filters.toml" "$HOME/Library/Application Support/rtk/filters.toml"
      rtk init -g --opencode --auto-patch >/dev/null
