      - id: "441258766" 
        name: "Magnet" 
      - id: "1575588022"
        name: "MenubarX" 
      - id: "1295203466"
        name: "Microsoft Remote Desktop" 
      - id: "409203825" 
        name: "Numbers" 
      - id: "409201541" 
        name: "Pages" 
      - id: "1153157709"
        name: "Speedtest" 
      - id: "1278508951"
        name: "Trello" 
      - id: "1607635845"
