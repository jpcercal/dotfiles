# yaml-language-server: $schema=./schema/apps.schema.json
---
schema_version: 2
install:
  execution:
    max_jobs: 0
    locks:
      brew: 1
      mas: 4
      go: 4
  toolchains:
    rustup:
      channel: "stable"
    node:
      ensure: "lts"
    python:
      provider: "uv"
