      set -e
      mkdir -p "$HOME/.config/tmux"
      ln -sfn "$DOTFILES_DIR/tmux.conf" "$HOME/.config/tmux/tmux.conf"
- id: "brew-formula:tpm"
- id: "brew-formula:tree"
- id: "brew-formula:trivy"
- id: "brew-formula:unison"
- id: "brew-formula:universal-ctags"
- id: "brew-formula:uv"
  hooks:
    post-install: |
      set -e
      uv python install >/dev/null
      py="$(uv python find)"
      [ -n "$py" ] || exit 1
      d="$(dirname "$py")"
      mkdir -p "$HOME/.local/bin"
      ln -sfn "$d/python3" "$HOME/.local/bin/python"
      ln -sfn "$d/python3" "$HOME/.local/bin/python3"
      if [ -e "$d/pip3" ]; then
        ln -sfn "$d/pip3" "$HOME/.local/bin/pip"
        ln -sfn "$d/pip3" "$HOME/.local/bin/pip3"
      fi
- id: "brew-formula:vim"
  hooks:
    post-install: |
      ln -sfn "$DOTFILES_DIR/.vimrc" "$HOME/.vimrc"
