      - "font-inconsolata-lgc-nerd-font"
      - "font-inconsolata-nerd-font"
      - "font-iosevka-nerd-font"
      - "font-jetbrains-mono-nerd-font"
      - "font-lekton-nerd-font"
      - "font-liberation-nerd-font"
