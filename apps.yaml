    hooks:
      post-install: |
        mkdir -p "$HOME/.config/opencode/skills"
        f="$HOME/.config/opencode/AGENTS.md"; [ -e "$f" ] && [ ! -L "$f" ] && mv "$f" "${f}.$(date +%Y.%m.%d).bkp"; ln -sfn "$DOTFILES_DIR/opencode/AGENTS.md" "$f"
        f="$HOME/.config/opencode/opencode.json"; [ -e "$f" ] && [ ! -L "$f" ] && mv "$f" "${f}.$(date +%Y.%m.%d).bkp"; ln -sfn "$DOTFILES_DIR/opencode/opencode.json" "$f"
        f="$HOME/.config/opencode/opencode.jsonc"; [ -e "$f" ] && [ ! -L "$f" ] && mv "$f" "${f}.$(date +%Y.%m.%d).bkp"; ln -sfn "$DOTFILES_DIR/opencode/opencode.jsonc" "$f"
        f="$HOME/.config/opencode/skills/builder"; [ -e "$f" ] && [ ! -L "$f" ] && mv "$f" "${f}.$(date +%Y.%m.%d).bkp"; ln -sfn "$DOTFILES_DIR/opencode/skills/builder" "$f" 
