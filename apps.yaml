  pip:
    packages:
      - "pynvim"
      - "neovim"
  go:
    packages:
      - "github.com/oklog/ulid/v2/cmd/ulid@latest"
  toolchains:
    rustup:
      channel: "stable"
    node:
      ensure: "lts"
    python:
      provider: "uv"
  bootstrap:
    - "fzf-keybindings"
    - "git-lfs"
    - "python-links"
    - "nvim-plug"
    - "opencode"
    - "rtk-patch"
    - "claude-mem"
  gem:
    rubygems:
      - "neovim"
  npm:
    global:
      packages:
        - "neovim"
        - "prettier"
  mas:
    apps:    
      - id: "1018301773"
        name: "AdBlock Pro" 
      - id: "824171161" 
        name: "Affinity Designer" 
      - id: "824183456" 
        name: "Affinity Photo" 
      - id: "918858936" 
