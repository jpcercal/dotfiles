name: macOS

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  test:
    name: unit + integration + e2e (parallel, sandboxed)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # No GUI feature: skips eframe/egui build (~halves compile time).
      # Unit + backend integration (stub binaries) + `sync --sandbox` E2E.
      - run: cargo nextest run --workspace --no-default-features --profile ci

  build-release:
    name: release binary (with GUI)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
      - run: cargo build --release --workspace
      - run: ./target/release/dotfiles --version

  coverage:
    name: coverage (exec/manifest/backends/prefs)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # dotfiles-core is intentionally excluded: its pipeline/probes execute
      # real system tools and are covered by the `sync --sandbox` E2E test,
      # not by line coverage.
      - run: >-
          cargo llvm-cov nextest --profile ci
          -p dotfiles-exec -p dotfiles-manifest -p dotfiles-backends -p dotfiles-prefs
          --fail-under-lines 80 --summary-only

  # Real-machine E2E: the successor of the old make pipeline
  # (software_update → install_dependencies → configure_apps →
  # apply_preferences), running the parallel dependency-graph engine for real
  # against a reduced fixture manifest (DOTFILES_MANIFEST / DOTFILES_PREFS
  # overrides). MAS apps are excluded (no App Store sign-in on CI) — they are
  # covered by `verify-manifest` instead.
  e2e-machine:
    name: e2e real-machine install (parallel engine)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-e2e
      - run: cargo build --release --no-default-features
      # Old `make software_update`: report-only on CI (a real
      # `softwareupdate -i` reboots the runner and never belongs in CI).
      - name: list software updates
        run: softwareupdate -l || true
      - name: bootstrap (Homebrew + taps)
        run: DOTFILES_MANIFEST=e2e/apps.ci.yaml ./target/release/dotfiles bootstrap
      - name: install (parallel dependency-graph engine)
        run: DOTFILES_MANIFEST=e2e/apps.ci.yaml ./target/release/dotfiles install
      - name: configure (dirs, symlinks)
        run: DOTFILES_MANIFEST=e2e/apps.ci.yaml ./target/release/dotfiles apply
      - name: prefs apply + drift gate
        run: |
          DOTFILES_PREFS=e2e/prefs.ci.yaml ./target/release/dotfiles prefs apply
          DOTFILES_PREFS=e2e/prefs.ci.yaml ./target/release/dotfiles prefs diff
      - name: assert fixture tools landed
        run: |
          test -x /opt/homebrew/bin/jq
          test -x /opt/homebrew/bin/fd
          test -x /opt/homebrew/bin/fzf
          test -L ~/.editorconfig
          test -L ~/.config/starship.toml

  # Full-manifest reference check: every formula/cask/MAS id/npm/pip/go
  # module/tap listed in the production apps.yaml exists upstream and every
  # symlink/dock/bootstrap reference is wired correctly. Read-only probes,
  # fanned out in parallel by `dotfiles verify`.
  verify-manifest:
    name: verify apps.yaml references
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-verify
      - run: cargo build --release --no-default-features
      - run: ./target/release/dotfiles verify
