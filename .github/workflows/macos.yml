  config:
      name: Configure
      runs-on: macos-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v3

        - name: install software updates
          run: make software_update

        - name: install dependencies
          run: make install_dependencies
        
        # - name: configure apps
        #   run: make configure_apps

        # - name: apply custom preferences
        #   run: make apply_preferences

        - name: update history of executed commands
          shell: zsh {0}
          run: |
            brew install zsh zsh-completions atuin coreutils
            export PATH="$HOME/go/bin:$PATH"
            go install github.com/oklog/ulid/v2/cmd/ulid@latest
            mkdir -p "$HOME/.local/share/atuin"
            sqlite3 "$HOME/.local/share/atuin/history.db" <<'SQL'
            CREATE TABLE IF NOT EXISTS history (
              id TEXT NOT NULL PRIMARY KEY,
              timestamp TEXT,
              duration TEXT,
              exit TEXT,
              command TEXT NOT NULL,
              cwd TEXT,
              session TEXT,
              hostname TEXT,
              deleted_at TEXT
            );
            SQL
            eval "$(atuin init zsh)"
            make update_history_commands
