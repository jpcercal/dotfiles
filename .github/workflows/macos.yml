name: MacOS Workflow
on: [push]

jobs:
  config:
      name: Configure
      runs-on: macos-latest
      timeout-minutes: 180
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: run
          env:
            SKIP_JOBS: software_update
          run: make
