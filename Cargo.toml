[workspace]
members = ["crates/core", "crates/dotfiles"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["João Paulo Cercal <jpcercal@gmail.com>"]
license = "MIT"
repository = "https://github.com/jpcercal/dotfiles"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
crossbeam-channel = "0.5"
dirs = "6.0"
secrecy = "0.10"
notify-rust = "4.11"
