  # =========================================================================
  # Spotlight
  # =========================================================================
  - id: spotlight.exclude-volumes
    kind: defaults
    domain: .Spotlight-V100/VolumeConfiguration
    key: Exclusions
    type: array
    value: ["/Volumes"]
    sudo: true
    note: "disable Spotlight indexing for any newly mounted volume"

  - id: spotlight.ordered-items
    kind: exec
    program: defaults
    args:
      - "write"
      - "com.apple.spotlight"
      - "orderedItems"
      - "-array"
      - '{"enabled" = 1;"name" = "APPLICATIONS";}'
      - '{"enabled" = 1;"name" = "SYSTEM_PREFS";}'
      - '{"enabled" = 1;"name" = "DIRECTORIES";}'
      - '{"enabled" = 1;"name" = "PDF";}'
      - '{"enabled" = 1;"name" = "FONTS";}'
      - '{"enabled" = 0;"name" = "DOCUMENTS";}'
      - '{"enabled" = 0;"name" = "MESSAGES";}'
      - '{"enabled" = 0;"name" = "CONTACT";}'
      - '{"enabled" = 0;"name" = "EVENT_TODO";}'
      - '{"enabled" = 0;"name" = "IMAGES";}'
      - '{"enabled" = 0;"name" = "BOOKMARKS";}'
      - '{"enabled" = 0;"name" = "MUSIC";}'
      - '{"enabled" = 0;"name" = "MOVIES";}'
      - '{"enabled" = 0;"name" = "PRESENTATIONS";}'
      - '{"enabled" = 0;"name" = "SPREADSHEETS";}'
      - '{"enabled" = 0;"name" = "SOURCE";}'
      - '{"enabled" = 0;"name" = "MENU_DEFINITION";}'
      - '{"enabled" = 0;"name" = "MENU_OTHER";}'
      - '{"enabled" = 0;"name" = "MENU_CONVERSION";}'
      - '{"enabled" = 0;"name" = "MENU_EXPRESSION";}'
      - '{"enabled" = 0;"name" = "MENU_WEBSEARCH";}'
      - '{"enabled" = 0;"name" = "MENU_SPOTLIGHT_SUGGESTIONS";}'
    note: "indexing order; disabled categories avoid sending queries to Apple"

  - id: spotlight.reload-mds
    kind: exec
    program: killall
    args: ["mds"]
    sudo: true
    ignore_error: true
    note: "load new settings before rebuilding the index"

  - id: spotlight.enable-main-volume
    kind: exec
    program: mdutil
    args: ["-i", "on", "/"]
    sudo: true

  - id: spotlight.rebuild-index
    kind: exec
    program: mdutil
    args: ["-E", "/"]
    sudo: true

