# yaml-language-server: $schema=./schema/prefs.schema.json
---
prefs:
  # =========================================================================
  # Setup: Homebrew perms, login items, quit System Settings
  # =========================================================================
  - id: setup.homebrew-share-perms
    kind: exec
    program: chmod
    args: ["g-w", "/opt/homebrew/share"]
    note: "Homebrew permissions"

  - id: login-item.docker
    kind: builtin
    name: login-item
    app: "/Applications/Docker.app/"
    hidden: true

  - id: login-item.velja
    kind: builtin
    name: login-item
    app: "/Applications/Velja.app/"
    hidden: true

  - id: login-item.macs-fan-control
    kind: builtin
    name: login-item
    app: "/Applications/Macs Fan Control.app"

  - id: login-item.alfred
    kind: builtin
    name: login-item
    app: "/Applications/Alfred 5.app"

  - id: login-item.magnet
    kind: builtin
    name: login-item
    app: "/Applications/Magnet.app"

  - id: setup.quit-system-settings
    kind: exec
    program: osascript
    args: ["-e", "tell application \"System Settings\" to quit"]
    ignore_error: true
    note: "close System Settings panes so they don't override our changes"

  # =========================================================================
  # General UI/UX
  # =========================================================================
  - id: system.boot-sound-off
    kind: exec
    program: nvram
    args: ["SystemAudioVolume= "]
    sudo: true
    note: "disable the sound effects on boot"

  - id: ui.highlight-color
    kind: defaults
    domain: NSGlobalDomain
    key: AppleHighlightColor
    type: string
    value: "0.764700 0.976500 0.568600"
    note: "set highlight color to green"

  - id: ui.sidebar-icon-size
    kind: defaults
    domain: NSGlobalDomain
    key: NSTableViewDefaultSizeMode
    type: int
    value: 2
    note: "set sidebar icon size to medium"

  - id: ui.scrollbars
    kind: defaults
    domain: NSGlobalDomain
    key: AppleShowScrollBars
    type: string
    value: "Always"

  - id: ui.focus-ring-animation
    kind: defaults
    domain: NSGlobalDomain
    key: NSUseAnimatedFocusRing
    type: bool
    value: false
    note: "disable the over-the-top focus ring animation"

  - id: ui.window-resize-speed
    kind: defaults
    domain: NSGlobalDomain
    key: NSWindowResizeTime
    type: float
    value: 0.001
    note: "increase window resize speed for Cocoa applications"

  - id: ui.save-panel-expanded
    kind: defaults
    domain: NSGlobalDomain
    key: NSNavPanelExpandedStateForSaveMode
    type: bool
    value: true

  - id: ui.save-panel-expanded-2
    kind: defaults
    domain: NSGlobalDomain
    key: NSNavPanelExpandedStateForSaveMode2
    type: bool
    value: true

  - id: ui.print-panel-expanded
    kind: defaults
    domain: NSGlobalDomain
    key: PMPrintingExpandedStateForPrint
    type: bool
    value: true

  - id: ui.print-panel-expanded-2
    kind: defaults
    domain: NSGlobalDomain
    key: PMPrintingExpandedStateForPrint2
    type: bool
    value: true

  - id: ui.printer-quit-when-finished
    kind: defaults
    domain: com.apple.print.PrintingPrefs
    key: "Quit When Finished"
    type: bool
    value: true

  - id: ui.disable-quarantine-dialog
    kind: defaults
    domain: com.apple.LaunchServices
    key: LSQuarantine
    type: bool
    value: false
    note: "disable the “Are you sure you want to open this application?” dialog"

  - id: ui.lsregister-rebuild
    kind: exec
    program: "/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister"
    args: ["-kill", "-r", "-domain", "local", "-domain", "system", "-domain", "user"]
    note: "remove duplicates in the “Open With” menu"

  - id: ui.text-control-characters
    kind: defaults
    domain: NSGlobalDomain
    key: NSTextShowsControlCharacters
    type: bool
    value: true

  - id: ui.disable-resume
    kind: defaults
    domain: com.apple.systempreferences
    key: NSQuitAlwaysKeepsWindows
    type: bool
    value: false
    note: "disable Resume system-wide"

  - id: ui.disable-auto-termination
    kind: defaults
    domain: NSGlobalDomain
    key: NSDisableAutomaticTermination
    type: bool
    value: true

  - id: ui.disable-crash-reporter
    kind: defaults
    domain: com.apple.CrashReporter
    key: DialogType
    type: string
    value: "none"

  - id: ui.help-viewer-dev-mode
    kind: defaults
    domain: com.apple.helpviewer
    key: DevMode
    type: bool
    value: true

  - id: ui.login-window-hostinfo
    kind: defaults
    domain: /Library/Preferences/com.apple.loginwindow
    key: AdminHostInfo
    type: string
    value: "HostName"
    sudo: true

  - id: system.restart-on-freeze
    kind: exec
    program: systemsetup
    args: ["-setrestartfreeze", "on"]
    sudo: true

  - id: typing.disable-capitalization
    kind: defaults
    domain: NSGlobalDomain
    key: NSAutomaticCapitalizationEnabled
    type: bool
    value: false

  - id: typing.disable-smart-dashes
    kind: defaults
    domain: NSGlobalDomain
    key: NSAutomaticDashSubstitutionEnabled
    type: bool
    value: false

  - id: typing.disable-period-substitution
    kind: defaults
    domain: NSGlobalDomain
    key: NSAutomaticPeriodSubstitutionEnabled
    type: bool
    value: false

  - id: typing.disable-smart-quotes
    kind: defaults
    domain: NSGlobalDomain
    key: NSAutomaticQuoteSubstitutionEnabled
    type: bool
    value: false

  - id: typing.disable-auto-correct
    kind: defaults
    domain: NSGlobalDomain
    key: NSAutomaticSpellingCorrectionEnabled
    type: bool
    value: false

  # =========================================================================
  # Trackpad, mouse, keyboard, Bluetooth accessories, and input
  # =========================================================================
  - id: trackpad.tap-to-click.user
    kind: defaults
    domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: Clicking
    type: bool
    value: true

  - id: trackpad.tap-to-click.login-screen
    kind: defaults
    domain: NSGlobalDomain
    key: com.apple.mouse.tapBehavior
    type: int
    value: 1
    current_host: true

  - id: trackpad.tap-to-click.global
    kind: defaults
    domain: NSGlobalDomain
    key: com.apple.mouse.tapBehavior
    type: int
    value: 1

  - id: trackpad.corner-right-click
    kind: defaults
    domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: TrackpadCornerSecondaryClick
    type: int
    value: 2
    note: "map bottom right corner to right-click"

  - id: trackpad.right-click
    kind: defaults
    domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: TrackpadRightClick
    type: bool
    value: true

  - id: trackpad.corner-click-behavior
    kind: defaults
    domain: NSGlobalDomain
    key: com.apple.trackpad.trackpadCornerClickBehavior
    type: int
    value: 1
    current_host: true

  - id: trackpad.secondary-click
    kind: defaults
    domain: NSGlobalDomain
    key: com.apple.trackpad.enableSecondaryClick
    type: bool
    value: true
    current_host: true

  - id: bluetooth.audio-bitpool-min
    kind: defaults
    domain: com.apple.BluetoothAudioAgent
    key: "Apple Bitpool Min (editable)"
    type: int
    value: 40
    note: "increase sound quality for Bluetooth headphones/headsets"

  - id: keyboard.full-access
    kind: defaults
    domain: NSGlobalDomain
    key: AppleKeyboardUIMode
    type: int
    value: 3
    note: "enable full keyboard access for all controls (Tab in modal dialogs)"

  - id: keyboard.zoom-scroll-wheel
    kind: defaults
    domain: com.apple.universalaccess
    key: closeViewScrollWheelToggle
    type: bool
    value: true
    sudo: true

  - id: keyboard.zoom-scroll-modifier
    kind: defaults
    domain: com.apple.universalaccess
    key: HIDScrollZoomModifierMask
    type: int
    value: 262144
    sudo: true

  - id: keyboard.zoom-follows-focus
    kind: defaults
    domain: com.apple.universalaccess
    key: closeViewZoomFollowsFocus
    type: bool
    value: true
    sudo: true

  - id: keyboard.disable-press-and-hold
    kind: defaults
    domain: NSGlobalDomain
    key: ApplePressAndHoldEnabled
    type: bool
    value: false
    note: "favor key repeat over press-and-hold accents"

  - id: keyboard.key-repeat
    kind: defaults
    domain: NSGlobalDomain
    key: KeyRepeat
    type: int
    value: 1
    note: "blazingly fast keyboard repeat rate"

  - id: keyboard.initial-key-repeat
    kind: defaults
    domain: NSGlobalDomain
    key: InitialKeyRepeat
    type: int
    value: 10

  - id: locale.languages
    kind: defaults
    domain: NSGlobalDomain
    key: AppleLanguages
    type: array
    value: ["en", "pt_BR"]

  - id: locale.locale
    kind: defaults
    domain: NSGlobalDomain
    key: AppleLocale
    type: string
    value: "en_GB@currency=BRL"

  - id: locale.measurement-units
    kind: defaults
    domain: NSGlobalDomain
    key: AppleMeasurementUnits
    type: string
    value: "Centimeters"

  - id: locale.metric-units
    kind: defaults
    domain: NSGlobalDomain
    key: AppleMetricUnits
    type: bool
    value: true

  - id: locale.login-input-menu
    kind: defaults
    domain: /Library/Preferences/com.apple.loginwindow
    key: showInputMenu
    type: bool
    value: true
    sudo: true
    note: "show language menu in the top right corner of the boot screen"

  - id: locale.timezone
    kind: exec
    program: systemsetup
    args: ["-settimezone", "America/Sao_Paulo"]
    sudo: true

  # =========================================================================
  # Screen
  # =========================================================================
  - id: screen.ask-password
    kind: defaults
    domain: com.apple.screensaver
    key: askForPassword
    type: int
    value: 1
    note: "require password immediately after sleep or screen saver begins"

  - id: screen.ask-password-delay
    kind: defaults
    domain: com.apple.screensaver
    key: askForPasswordDelay
    type: int
    value: 0

  - id: screen.screenshot-location
    kind: defaults
    domain: com.apple.screencapture
    key: location
    type: string
    value: "~/Desktop"

  - id: screen.screenshot-format
    kind: defaults
    domain: com.apple.screencapture
    key: type
    type: string
    value: "png"

  - id: screen.screenshot-no-shadow
    kind: defaults
    domain: com.apple.screencapture
    key: disable-shadow
    type: bool
    value: true

  - id: screen.font-smoothing
    kind: defaults
    domain: NSGlobalDomain
    key: AppleFontSmoothing
    type: int
    value: 1
    note: "enable subpixel font rendering on non-Apple LCDs"

  - id: screen.hidpi-modes
    kind: defaults
    domain: /Library/Preferences/com.apple.windowserver
    key: DisplayResolutionEnabled
    type: bool
    value: true
    sudo: true

  # =========================================================================
  # Finder
  # =========================================================================
  - id: finder.disable-animations
    kind: defaults
    domain: com.apple.finder
    key: DisableAllAnimations
    type: bool
    value: true

  - id: finder.new-window-target
    kind: defaults
    domain: com.apple.finder
    key: NewWindowTarget
    type: string
    value: "PfDe"
    note: "set Desktop as the default location for new Finder windows"

  - id: finder.new-window-target-path
    kind: defaults
    domain: com.apple.finder
    key: NewWindowTargetPath
    type: string
    value: "file://~/Desktop/"

  - id: finder.show-external-drives
    kind: defaults
    domain: com.apple.finder
    key: ShowExternalHardDrivesOnDesktop
    type: bool
    value: true

  - id: finder.show-hard-drives
    kind: defaults
    domain: com.apple.finder
    key: ShowHardDrivesOnDesktop
    type: bool
    value: true

  - id: finder.show-mounted-servers
    kind: defaults
    domain: com.apple.finder
    key: ShowMountedServersOnDesktop
    type: bool
    value: true

  - id: finder.show-removable-media
    kind: defaults
    domain: com.apple.finder
    key: ShowRemovableMediaOnDesktop
    type: bool
    value: true

  - id: finder.show-hidden-files
    kind: defaults
    domain: com.apple.finder
    key: AppleShowAllFiles
    type: bool
    value: true

  - id: finder.show-all-extensions
    kind: defaults
    domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true

  - id: finder.show-status-bar
    kind: defaults
    domain: com.apple.finder
    key: ShowStatusBar
    type: bool
    value: true

  - id: finder.show-path-bar
    kind: defaults
    domain: com.apple.finder
    key: ShowPathbar
    type: bool
    value: true

  - id: finder.posix-path-title
    kind: defaults
    domain: com.apple.finder
    key: _FXShowPosixPathInTitle
    type: bool
    value: true

  - id: finder.folders-first
    kind: defaults
    domain: com.apple.finder
    key: _FXSortFoldersFirst
    type: bool
    value: true

  - id: finder.search-current-folder
    kind: defaults
    domain: com.apple.finder
    key: FXDefaultSearchScope
    type: string
    value: "SCcf"

  - id: finder.no-extension-warning
    kind: defaults
    domain: com.apple.finder
    key: FXEnableExtensionChangeWarning
    type: bool
    value: false

  - id: finder.spring-loading
    kind: defaults
    domain: NSGlobalDomain
    key: com.apple.springing.enabled
    type: bool
    value: true

  - id: finder.spring-loading-delay
    kind: defaults
    domain: NSGlobalDomain
    key: com.apple.springing.delay
    type: float
    value: 0

  - id: finder.no-ds-store-network
    kind: defaults
    domain: com.apple.desktopservices
    key: DSDontWriteNetworkStores
    type: bool
    value: true

  - id: finder.no-ds-store-usb
    kind: defaults
    domain: com.apple.desktopservices
    key: DSDontWriteUSBStores
    type: bool
    value: true

  - id: finder.auto-open-ro-volumes
    kind: defaults
    domain: com.apple.frameworks.diskimages
    key: auto-open-ro-root
    type: bool
    value: true

  - id: finder.auto-open-rw-volumes
    kind: defaults
    domain: com.apple.frameworks.diskimages
    key: auto-open-rw-root
    type: bool
    value: true

  - id: finder.open-window-for-new-disk
    kind: defaults
    domain: com.apple.finder
    key: OpenWindowForNewRemovableDisk
    type: bool
    value: true

  - id: finder.icon-info.desktop
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set :DesktopViewSettings:IconViewSettings:showItemInfo true", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.icon-info.fk-standard
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set :FK_StandardViewSettings:IconViewSettings:showItemInfo true", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.icon-info.standard
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set :StandardViewSettings:IconViewSettings:showItemInfo true", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.icon-label-right
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set DesktopViewSettings:IconViewSettings:labelOnBottom false", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.icon-grid.desktop
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set :DesktopViewSettings:IconViewSettings:arrangeBy grid", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.icon-grid.fk-standard
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set :FK_StandardViewSettings:IconViewSettings:arrangeBy grid", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.icon-grid.standard
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set :StandardViewSettings:IconViewSettings:arrangeBy grid", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.grid-spacing.desktop
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set :DesktopViewSettings:IconViewSettings:gridSpacing 100", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.grid-spacing.fk-standard
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set :FK_StandardViewSettings:IconViewSettings:gridSpacing 100", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.grid-spacing.standard
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set :StandardViewSettings:IconViewSettings:gridSpacing 100", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.icon-size.desktop
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set :DesktopViewSettings:IconViewSettings:iconSize 80", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.icon-size.fk-standard
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set :FK_StandardViewSettings:IconViewSettings:iconSize 80", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.icon-size.standard
    kind: exec
    program: /usr/libexec/PlistBuddy
    args: ["-c", "Set :StandardViewSettings:IconViewSettings:iconSize 80", "~/Library/Preferences/com.apple.finder.plist"]

  - id: finder.list-view-default
    kind: defaults
    domain: com.apple.finder
    key: FXPreferredViewStyle
    type: string
    value: "Nlsv"
    note: "use list view in all Finder windows by default"

  - id: finder.airdrop-all-interfaces
    kind: defaults
    domain: com.apple.NetworkBrowser
    key: BrowseAllInterfaces
    type: bool
    value: true

  - id: finder.show-home-library
    kind: exec
    program: chflags
    args: ["nohidden", "~/Library"]

  - id: finder.show-volumes
    kind: exec
    program: chflags
    args: ["nohidden", "/Volumes"]
    sudo: true

  - id: finder.info-panes-expanded
    kind: defaults
    domain: com.apple.finder
    key: FXInfoPanesExpanded
    type: dict
    value:
      General: true
      OpenWith: true
      Privileges: true
    note: "expand General/Open with/Sharing & Permissions File Info panes"

  # =========================================================================
  # Dock, Dashboard, and hot corners
  # =========================================================================
  - id: dock.stack-hover-highlight
    kind: defaults
    domain: com.apple.dock
    key: mouse-over-hilite-stack
    type: bool
    value: true

  - id: dock.tile-size
    kind: defaults
    domain: com.apple.dock
    key: tilesize
    type: int
    value: 36

  - id: dock.minimize-effect
    kind: defaults
    domain: com.apple.dock
    key: mineffect
    type: string
    value: "scale"

  - id: dock.minimize-to-app-icon
    kind: defaults
    domain: com.apple.dock
    key: minimize-to-application
    type: bool
    value: true

  - id: dock.spring-load-all
    kind: defaults
    domain: com.apple.dock
    key: enable-spring-load-actions-on-all-items
    type: bool
    value: true

  - id: dock.process-indicators
    kind: defaults
    domain: com.apple.dock
    key: show-process-indicators
    type: bool
    value: true

  - id: dock.no-launch-anim
    kind: defaults
    domain: com.apple.dock
    key: launchanim
    type: bool
    value: false

  - id: dock.mission-control-speed
    kind: defaults
    domain: com.apple.dock
    key: expose-animation-duration
    type: float
    value: 0.1

  - id: dock.expose-not-grouped
    kind: defaults
    domain: com.apple.dock
    key: expose-group-by-app
    type: bool
    value: false

  - id: dock.dashboard-disabled
    kind: defaults
    domain: com.apple.dashboard
    key: mcx-disabled
    type: bool
    value: true

  - id: dock.dashboard-no-space
    kind: defaults
    domain: com.apple.dock
    key: dashboard-in-overlay
    type: bool
    value: true

  - id: dock.spaces-no-rearrange
    kind: defaults
    domain: com.apple.dock
    key: mru-spaces
    type: bool
    value: false

  - id: dock.autohide-delay-off
    kind: defaults
    domain: com.apple.dock
    key: autohide-delay
    type: float
    value: 0

  - id: dock.autohide-anim-off
    kind: defaults
    domain: com.apple.dock
    key: autohide-time-modifier
    type: float
    value: 0

  - id: dock.autohide
    kind: defaults
    domain: com.apple.dock
    key: autohide
    type: bool
    value: false

  - id: dock.hidden-apps-translucent
    kind: defaults
    domain: com.apple.dock
    key: showhidden
    type: bool
    value: true

  - id: dock.no-recent-apps
    kind: defaults
    domain: com.apple.dock
    key: show-recents
    type: bool
    value: false

  - id: dock.reset-launchpad-layout
    kind: exec
    program: find
    args: ["~/Library/Application Support/Dock", "-name", "*-*.db", "-maxdepth", "1", "-delete"]
    ignore_error: true
    note: "reset Launchpad, but keep the desktop wallpaper intact"

  - id: dock.hot-corner.tl
    kind: defaults
    domain: com.apple.dock
    key: wvous-tl-corner
    type: int
    value: 2
    note: "top left → Mission Control"

  - id: dock.hot-corner.tl-modifier
    kind: defaults
    domain: com.apple.dock
    key: wvous-tl-modifier
    type: int
    value: 0

  - id: dock.hot-corner.tr
    kind: defaults
    domain: com.apple.dock
    key: wvous-tr-corner
    type: int
    value: 4
    note: "top right → Desktop"

  - id: dock.hot-corner.tr-modifier
    kind: defaults
    domain: com.apple.dock
    key: wvous-tr-modifier
    type: int
    value: 0

  - id: dock.hot-corner.bl
    kind: defaults
    domain: com.apple.dock
    key: wvous-bl-corner
    type: int
    value: 11
    note: "bottom left → Launchpad"

  - id: dock.hot-corner.bl-modifier
    kind: defaults
    domain: com.apple.dock
    key: wvous-bl-modifier
    type: int
    value: 0

  - id: dock.hot-corner.br
    kind: defaults
    domain: com.apple.dock
    key: wvous-br-corner
    type: int
    value: 11
    note: "bottom right → Launchpad"

  - id: dock.hot-corner.br-modifier
    kind: defaults
    domain: com.apple.dock
    key: wvous-br-modifier
    type: int
    value: 0

  # =========================================================================
  # Safari & WebKit
  # =========================================================================
  - id: safari.no-search-queries-to-apple.search
    kind: defaults
    domain: com.apple.Safari
    key: UniversalSearchEnabled
    type: bool
    value: false

  - id: safari.no-search-queries-to-apple.suggestions
    kind: defaults
    domain: com.apple.Safari
    key: SuppressSearchSuggestions
    type: bool
    value: true

  - id: safari.tab-highlights-links
    kind: defaults
    domain: com.apple.Safari
    key: WebKitTabToLinksPreferenceKey
    type: bool
    value: true

  - id: safari.tab-highlights-links-webkit2
    kind: defaults
    domain: com.apple.Safari
    key: com.apple.Safari.ContentPageGroupIdentifier.WebKit2TabsToLinks
    type: bool
    value: true

  - id: safari.full-url
    kind: defaults
    domain: com.apple.Safari
    key: ShowFullURLInSmartSearchField
    type: bool
    value: true

  - id: safari.homepage-blank
    kind: defaults
    domain: com.apple.Safari
    key: HomePage
    type: string
    value: "about:blank"

  - id: safari.no-auto-open-downloads
    kind: defaults
    domain: com.apple.Safari
    key: AutoOpenSafeDownloads
    type: bool
    value: false

  - id: safari.backspace-navigation
    kind: defaults
    domain: com.apple.Safari
    key: com.apple.Safari.ContentPageGroupIdentifier.WebKit2BackspaceKeyNavigationEnabled
    type: bool
    value: true

  - id: safari.hide-bookmarks-bar
    kind: defaults
    domain: com.apple.Safari
    key: ShowFavoritesBar
    type: bool
    value: false

  - id: safari.hide-top-sites-sidebar
